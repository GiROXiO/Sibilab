
{% extends 'core/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Registrar devolución</h4>
        </div>

        <div class="card-body p-4">
            <p>
                <strong>Préstamo:</strong>
                {{ prestamo.idprestamo }}
            </p>

            <p>
                <strong>Libro:</strong>
                {{ prestamo.idsolicitud.isbn.titulo }}
            </p>

            <p>
                <strong>Usuario:</strong>
                {{ prestamo.idsolicitud.codigo_c.codigo.nombre }}
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="observaciones" class="form-label">
                        Observaciones
                    </label>

                    <textarea
                        class="form-control"
                        id="observaciones"
                        name="observaciones"
                        rows="4"
                        maxlength="200"
                        placeholder="Describe el estado del libro o cualquier novedad."
                    ></textarea>

                    <div class="form-text">
                        Máximo 200 caracteres.
                    </div>
                </div>

                <div class="form-check form-switch mb-4">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        role="switch"
                        id="libro_perdido"
                        name="libro_perdido"
                        value="si"
                    >

                    <label
                        class="form-check-label text-danger fw-bold"
                        for="libro_perdido"
                    >
                        El libro está perdido
                    </label>
                </div>

                <div class="d-flex justify-content-between">
                    <a
                        href="{% url 'procesar_devoluciones' %}"
                        class="btn btn-outline-secondary"
                    >
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-success">
                        Confirmar devolución
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
